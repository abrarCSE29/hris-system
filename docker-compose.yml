services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
      POSTGRES_DB: hris
    ports:
      - "5433:5432"
    volumes:
      - hris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  hris_pgdata:
